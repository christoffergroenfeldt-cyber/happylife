# Happy Life – school sync: Aula (MitID) + iCal feeds such as ForældreIntra.
# Every 5 minutes a quick check asks the database whether anything is due
# (a MitID login started in the app, "sync now", or the last sync > 2 hours
# old). Only then is Python set up and the sync run. See school/school_sync.py.
# Needs the repository secret HL_SCHOOL_KEY.
# The repo is public, so the log shows counts only – never names or codes.
name: School sync

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

concurrency:
  group: school-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: python3 school/school_sync.py check >> "$GITHUB_OUTPUT"
        env:
          HL_SCHOOL_KEY: ${{ secrets.HL_SCHOOL_KEY }}
      - if: steps.check.outputs.work == 'yes'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: school/requirements.txt
      - if: steps.check.outputs.work == 'yes'
        run: pip install -q -r school/requirements.txt
      - id: run
        if: steps.check.outputs.work == 'yes'
        run: python school/school_sync.py run
        env:
          HL_SCHOOL_KEY: ${{ secrets.HL_SCHOOL_KEY }}
          HAS_CLAUDE: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' && '1' || '' }}
      # Lektieliste: only when the MinUddannelse texts changed. Claude reads
      # work/lektier-input.json and writes work/lektier-output.json (nothing printed).
      - if: steps.run.outputs.lektier == 'yes'
        run: npm install -g @anthropic-ai/claude-code >/dev/null 2>&1
      - if: steps.run.outputs.lektier == 'yes'
        working-directory: work
        timeout-minutes: 10
        continue-on-error: true
        run: |
          claude -p "$(cat ../school/lektier-prompt.md)" \
            --model sonnet --max-turns 20 --output-format json \
            --allowedTools "Read,Write" > claude.json 2> claude.err \
            && echo "lektier finished" || echo "lektier stopped (exit $?)"
          node -e "const r=JSON.parse(require('fs').readFileSync('claude.json','utf8'));console.log('turns:',r.num_turns,'| result:',r.subtype,'| error:',r.is_error,'| seconds:',Math.round((r.duration_ms||0)/1000))" || echo "no result summary"
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      - if: steps.run.outputs.lektier == 'yes'
        run: python school/school_sync.py lektier
        env:
          HL_SCHOOL_KEY: ${{ secrets.HL_SCHOOL_KEY }}
