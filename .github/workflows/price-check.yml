# Happy Life – price watch ("Prisjagt"). Every 5 minutes a quick check asks the
# database whether anything is due: a product someone tapped "Tjek nu" on, or
# the daily check of every product (from 02:30, so that run's 5-hour Claude usage window ends before morning). Only then Claude Code searches
# for prices (with the family's Claude subscription) and the results are saved
# through price_save(), which checks every offer again.
# Secrets: CLAUDE_CODE_OAUTH_TOKEN (from `claude setup-token`) and HL_SCHOOL_KEY.
# The repo is public: the log shows counts only – Claude's output is not printed.
name: Price check

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: price-check
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - id: jobs
        run: node scripts/price-check.mjs jobs >> "$GITHUB_OUTPUT"
        env:
          HL_SCHOOL_KEY: ${{ secrets.HL_SCHOOL_KEY }}
          HAS_CLAUDE: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' && '1' || '' }}
      - if: steps.jobs.outputs.work == 'yes'
        run: npm install -g @anthropic-ai/claude-code >/dev/null 2>&1
      - if: steps.jobs.outputs.work == 'yes'
        working-directory: work
        timeout-minutes: 30
        continue-on-error: true
        run: |
          claude -p "$(cat ../scripts/price-check-prompt.md)" \
            --model sonnet --max-turns 200 --output-format json \
            --allowedTools "WebSearch,WebFetch,Read,Write" > claude.json 2> claude.err \
            && echo "price search finished" || echo "price search stopped (exit $?)"
          # counts and tool names only (the repo is public)
          node -e "const r=JSON.parse(require('fs').readFileSync('claude.json','utf8'));console.log('turns:',r.num_turns,'| result:',r.subtype,'| error:',r.is_error,'| denied tools:',[...new Set((r.permission_denials||[]).map(d=>d.tool_name))].join(',')||'none','| seconds:',Math.round((r.duration_ms||0)/1000))" || echo "no result summary"
          grep -ciE "auth|token|login|credit|limit" claude.err | sed 's/^/stderr lines about auth or limits: /'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      - if: steps.jobs.outputs.work == 'yes'
        run: node scripts/price-check.mjs save
        env:
          HL_SCHOOL_KEY: ${{ secrets.HL_SCHOOL_KEY }}
